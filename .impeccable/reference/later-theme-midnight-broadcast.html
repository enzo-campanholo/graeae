<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,700;1,800;1,900&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
.m{position:absolute;inset:0;overflow:hidden}
.vx{background:linear-gradient(#78aee4,#c4e0f3 62%)}
.vx .sun{position:absolute;right:16%;top:12%;width:54px;height:54px;background:#fff6c8}
.vx .cl{position:absolute;top:20%;left:18%;width:140px;height:28px;background:#fff;box-shadow:60px -16px 0 -2px #fff}
.vx .t{position:absolute;bottom:0;width:12.6%;background:linear-gradient(#6fb04a 0 16px,#7a5636 16px 70%,#6a6a6a 70%)}
.vx .tr{position:absolute;width:12px;background:#6b4a2b}.vx .lf{position:absolute;width:76px;height:60px;background:#3f8a35}
.hb{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:2px;padding:2px;background:#0008}
.hb i{width:26px;height:26px;border:2px solid #9a9a9a}.hb i:nth-child(3){border-color:#fff}
.rc{background:linear-gradient(#18122e,#5b2f5f 52%,#3a3340 52%)}
.rc .mt{position:absolute;left:0;right:0;top:36%;height:16%;background:#2a1f3d;clip-path:polygon(0 100%,14% 30%,30% 70%,48% 10%,66% 60%,82% 25%,100% 100%)}
.rc .rd{position:absolute;left:-10%;right:-10%;bottom:0;height:48%;background:#2c2c33;clip-path:polygon(46% 0,54% 0,100% 100%,0 100%)}
.rc .ln{position:absolute;left:50%;bottom:0;width:8px;height:48%;margin-left:-4px;background:repeating-linear-gradient(#e9e2c8 0 22px,transparent 22px 48px)}
.rc .car{position:absolute;left:50%;bottom:8%;width:150px;height:56px;margin-left:-75px;background:#c8332d;border-radius:18px 18px 6px 6px;box-shadow:inset 0 -14px 0 #1b1b1f}
.rc .sp{position:absolute;right:18px;bottom:14px;font:800 30px/1 system-ui;color:#fff;text-align:right}.rc .sp small{display:block;font-size:12px;opacity:.8}
.rc .ps{position:absolute;right:18px;top:14px;font:800 26px/1 system-ui;color:#fff}
.cm{background:#4a3f37}.cm .sh{position:absolute;left:8%;top:10%;width:30%;height:52%;background:#3c332d;box-shadow:inset 0 -10px 0 #5c4d42,inset 0 -40px 0 #3c332d,inset 0 -48px 0 #6e5a4a}
.cm .lp{position:absolute;right:13%;top:14%;width:44px;height:44px;border-radius:50%;background:#f3c97a}
.cm .bd{position:absolute;left:50%;bottom:-30px;width:56%;height:44%;margin-left:-28%;border-radius:50% 50% 0 0;background:#2f5d7c}
.cm .hd{position:absolute;left:50%;top:24%;width:19%;height:40%;margin-left:-9.5%;border-radius:48% 48% 44% 44%;background:#c8977a}
.cm .hr{position:absolute;left:50%;top:20%;width:21%;height:16%;margin-left:-10.5%;border-radius:50% 50% 20% 20%;background:#2b1d16}
.cm .hp{position:absolute;left:50%;top:19%;width:25%;height:30%;margin-left:-12.5%;border:10px solid #18181b;border-bottom:0;border-radius:50% 50% 0 0}
.cm.b{background:#33424a}.cm.b .bd{background:#7a3b4c}.cm.b .hd{background:#e2b896}.cm.b .hr{background:#7a4a2a;height:22%}.cm.b .lp{background:#9fd3c7}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

body{width:1440px;height:900px;overflow:hidden;background:#0c0c0c;color:#fff;font:14px/1.35 Barlow,system-ui,sans-serif;display:flex}
.disp{font-family:"Barlow Condensed",sans-serif;font-style:italic;text-transform:uppercase}
.bar{width:288px;background:#141414;display:flex;flex-direction:column;position:relative;overflow:hidden}
.head{position:relative;display:grid;grid-template-columns:36px 1fr 36px;align-items:center;height:72px;padding:0 12px}
.head::before{content:"";position:absolute;inset:0 -20px 10px -20px;background:#ffe100;transform:skewY(-4deg);transform-origin:0 0}
.ib{position:relative;width:36px;height:36px;display:grid;place-items:center;color:#111}.ib .ic{width:20px;height:20px;stroke-width:2.25}
.room{position:relative;text-align:center;font:900 italic 30px/1 "Barlow Condensed";text-transform:uppercase;color:#111;letter-spacing:.01em}
.body{flex:1;padding:6px 12px}
.lbl{display:flex;justify-content:space-between;align-items:center;margin:8px 0 6px;font:700 italic 15px "Barlow Condensed";text-transform:uppercase;letter-spacing:.06em;color:#ffe100}
.sc{display:flex;gap:6px}.sc span{font:600 13px "Barlow Condensed";text-transform:uppercase;letter-spacing:.04em;padding:2px 9px;color:#fff;background:#262626;transform:skewX(-12deg)}
.row{position:relative;display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 12px}
.row.sel::before{content:"";position:absolute;inset:4px -4px 4px -16px;background:#ffe100;transform:skewX(-14deg)}
.row>*{position:relative}
.nm{flex:1;font:800 italic 22px/1 "Barlow Condensed";text-transform:uppercase}.nm small{display:block;font:500 12px Barlow;text-transform:none;color:#9a9a9a;margin-top:2px}
.sel .nm,.sel .nm small{color:#111}
.tag{width:8px;height:22px;transform:skewX(-14deg)}
.sh{width:32px;height:30px;display:grid;place-items:center;border:2px solid #3a3a3a;transform:skewX(-12deg);color:#ddd}.sh .ic{width:16px;height:16px;transform:skewX(12deg)}
.sh.w{background:#111;border-color:#111;color:#ffe100}
.row:not(.sel) .sh.w{background:#ffe100;border-color:#ffe100;color:#111}
.away{color:#5c5c5c}.away .nm{font-weight:700}.away .tag{background:#2c2c2c!important}
.foot{padding:12px;background:#0f0f0f;border-top:3px solid #ffe100}
.mine{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:10px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px;font-size:13px;color:#cfcfcf}
.stop{font:700 italic 15px "Barlow Condensed";text-transform:uppercase;padding:3px 12px;background:#e8412c;color:#fff;transform:skewX(-12deg)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:42px;display:flex;align-items:center;justify-content:center;gap:7px;font:800 italic 19px "Barlow Condensed";text-transform:uppercase;background:#ffe100;color:#111;transform:skewX(-12deg);box-shadow:4px 4px 0 #fff}
.btn .ic{width:17px;height:17px;stroke-width:2.25}
.btn.s{background:#111;color:#fff;box-shadow:4px 4px 0 #ffe100;border:2px solid #fff}
.stage{flex:1;padding:22px 26px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:22px 26px}
.cell{display:flex;flex-direction:column;min-height:0}
.tile{position:relative;flex:1;overflow:hidden;border-radius:14px}
.tile.f{box-shadow:0 0 0 3px #0c0c0c,0 0 0 6px #ffe100}
.cap{display:flex;align-items:center;gap:10px;margin-top:-14px;margin-left:16px;position:relative;z-index:1}
.cap b{font:900 italic 24px/1 "Barlow Condensed";text-transform:uppercase;background:#ffe100;color:#111;padding:4px 14px 3px;transform:skewX(-14deg)}
.cap span{font:700 italic 15px "Barlow Condensed";text-transform:uppercase;background:#111;color:#fff;padding:3px 10px;transform:skewX(-14deg);margin-top:10px}
.cap.d b{background:#fff}
</style></head><body>

<symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-mon" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></symbol>
</defs></svg>

<aside class="bar">
 <div class="head"><span class="ib"><svg class="ic"><use href="#i-home"/></svg></span><div class="room">The den</div><span class="ib"><svg class="ic"><use href="#i-gear"/></svg></span></div>
 <div class="body">

  <div class="row"><i class="tag" style="background:#ff7a3d"></i><span class="nm">Duda<small>Webcam</small></span><span class="sh"><svg class="ic"><use href="#i-cam"/></svg></span></div>
  <div class="row"><i class="tag" style="background:#c084fc"></i><span class="nm">Marta<small>You · webcam</small></span></div>
  <div class="lbl" style="margin-top:16px;color:#6a6a6a"><span>Not here</span></div>

 </div>
</aside>
<main class="stage">
 <div class="cell"><div class="tile f"><div class="m vx"><i class="sun"></i><i class="cl"></i><i class="t" style="left:0%;height:34%"></i><i class="t" style="left:12.5%;height:38%"></i><i class="t" style="left:25%;height:30%"></i><i class="t" style="left:37.5%;height:26%"></i><i class="t" style="left:50%;height:30%"></i><i class="t" style="left:62.5%;height:42%"></i><i class="t" style="left:75%;height:46%"></i><i class="t" style="left:87.5%;height:36%"></i><i class="tr" style="left:66%;bottom:42%;height:70px"></i><i class="lf" style="left:calc(66% - 32px);bottom:calc(42% + 60px)"></i><div class="hb"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div><div class="cap"><b>Bia</b><span>Screen</span></div></div>
