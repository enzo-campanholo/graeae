<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
.m{position:absolute;inset:0;overflow:hidden}
.vx{background:linear-gradient(#78aee4,#c4e0f3 62%)}
.vx .sun{position:absolute;right:16%;top:12%;width:54px;height:54px;background:#fff6c8}
.vx .cl{position:absolute;top:20%;left:18%;width:140px;height:28px;background:#fff;box-shadow:60px -16px 0 -2px #fff}
.vx .t{position:absolute;bottom:0;width:12.6%;background:linear-gradient(#6fb04a 0 16px,#7a5636 16px 70%,#6a6a6a 70%)}
.vx .tr{position:absolute;width:12px;background:#6b4a2b}.vx .lf{position:absolute;width:76px;height:60px;background:#3f8a35}
.hb{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:2px;padding:2px;background:#0008}
.hb i{width:26px;height:26px;border:2px solid #9a9a9a}.hb i:nth-child(3){border-color:#fff}
.rc{background:linear-gradient(#18122e,#5b2f5f 52%,#3a3340 52%)}
.rc .mt{position:absolute;left:0;right:0;top:36%;height:16%;background:#2a1f3d;clip-path:polygon(0 100%,14% 30%,30% 70%,48% 10%,66% 60%,82% 25%,100% 100%)}
.rc .rd{position:absolute;left:-10%;right:-10%;bottom:0;height:48%;background:#2c2c33;clip-path:polygon(46% 0,54% 0,100% 100%,0 100%)}
.rc .ln{position:absolute;left:50%;bottom:0;width:8px;height:48%;margin-left:-4px;background:repeating-linear-gradient(#e9e2c8 0 22px,transparent 22px 48px)}
.rc .car{position:absolute;left:50%;bottom:8%;width:150px;height:56px;margin-left:-75px;background:#c8332d;border-radius:18px 18px 6px 6px;box-shadow:inset 0 -14px 0 #1b1b1f}
.rc .sp{position:absolute;right:18px;bottom:14px;font:800 30px/1 system-ui;color:#fff;text-align:right}.rc .sp small{display:block;font-size:12px;opacity:.8}
.rc .ps{position:absolute;right:18px;top:14px;font:800 26px/1 system-ui;color:#fff}
.cm{background:#4a3f37}.cm .sh{position:absolute;left:8%;top:10%;width:30%;height:52%;background:#3c332d;box-shadow:inset 0 -10px 0 #5c4d42,inset 0 -40px 0 #3c332d,inset 0 -48px 0 #6e5a4a}
.cm .lp{position:absolute;right:13%;top:14%;width:44px;height:44px;border-radius:50%;background:#f3c97a}
.cm .bd{position:absolute;left:50%;bottom:-30px;width:56%;height:44%;margin-left:-28%;border-radius:50% 50% 0 0;background:#2f5d7c}
.cm .hd{position:absolute;left:50%;top:24%;width:19%;height:40%;margin-left:-9.5%;border-radius:48% 48% 44% 44%;background:#c8977a}
.cm .hr{position:absolute;left:50%;top:20%;width:21%;height:16%;margin-left:-10.5%;border-radius:50% 50% 20% 20%;background:#2b1d16}
.cm .hp{position:absolute;left:50%;top:19%;width:25%;height:30%;margin-left:-12.5%;border:10px solid #18181b;border-bottom:0;border-radius:50% 50% 0 0}
.cm.b{background:#33424a}.cm.b .bd{background:#7a3b4c}.cm.b .hd{background:#e2b896}.cm.b .hr{background:#7a4a2a;height:22%}.cm.b .lp{background:#9fd3c7}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

:root{--g0:#0b0b0c;--g1:#111113;--g2:#18181b;--g3:#232326;--g6:#5b5b61;--g8:#8e8e95;--g9:#b9b9bf;--g10:#ececee;--eye:#62d2de;--stop:#f26d6d}
body{width:1440px;height:900px;overflow:hidden;background:var(--g0);color:var(--g10);font:13px/1.45 Geist,system-ui,sans-serif;display:flex;padding:8px 8px 8px 0}
.bar{width:272px;display:flex;flex-direction:column;padding:0 8px}
.head{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;height:44px;padding:0 4px}
.ib{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--g8)}.ib .ic{width:16px;height:16px;stroke-width:1.75}
.room{text-align:center;font-weight:500}
.body{flex:1;padding-top:12px}
.lbl{display:flex;justify-content:space-between;align-items:center;height:28px;padding:0 8px;font-size:12px;color:var(--g8)}
.lbl em{font-style:normal;color:var(--g6)}
.row{display:flex;align-items:center;gap:10px;height:32px;padding:0 4px 0 8px;border-radius:6px;color:var(--g9)}
.row.on{background:var(--g2);color:var(--g10)}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;background:var(--g3);color:var(--g9);flex:none;position:relative}
.on .av::after{content:"";position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;background:var(--eye);box-shadow:0 0 0 2px var(--g2)}
.nm{flex:1;font-weight:500}
.sh{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--g6)}.sh .ic{width:15px;height:15px;stroke-width:1.75}
.sh.w{color:var(--eye)}
.away{color:var(--g6)}.away .av{background:transparent;box-shadow:inset 0 0 0 1px var(--g3);color:var(--g6)}
.sc{display:flex;gap:2px;padding:6px 4px 0}.sc span{height:26px;padding:0 6px;border-radius:6px;display:flex;align-items:center;font-size:12px;color:var(--g8)}
.foot{padding:8px 0 4px}
.mine{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden}
.meta{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 2px;font-size:12px;color:var(--g8)}
.meta b{color:var(--g9);font-weight:500}
.stop{height:24px;padding:0 8px;border-radius:6px;display:flex;align-items:center;color:var(--g9);background:var(--g2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;background:var(--g10);color:var(--g0)}
.btn .ic{width:15px;height:15px;stroke-width:1.75}.btn.s{background:var(--g2);color:var(--g8)}
kbd{font:500 10px "Geist Mono",monospace;opacity:.5;margin-left:2px}
.stage{flex:1;background:var(--g1);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.cell{display:flex;flex-direction:column;gap:6px;min-height:0}
.tile{position:relative;flex:1;border-radius:8px;overflow:hidden}
.cap{display:flex;align-items:center;gap:6px;height:20px;padding:0 2px;font-weight:500;color:var(--g9)}.cap small{font-size:12px;font-weight:400;color:var(--g6)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-mon" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></symbol>
</defs></svg>

<aside class="bar">
 <div class="head"><span class="ib"><svg class="ic"><use href="#i-home"/></svg></span><div class="room">The den</div><span class="ib"><svg class="ic"><use href="#i-gear"/></svg></span></div>
 <div class="body">
  <div class="lbl"><span>Here</span><em>4</em></div>
  <div class="row on"><i class="av">B</i><span class="nm">Bia</span><span class="sh w"><svg class="ic"><use href="#i-mon"/></svg></span><span class="sh w"><svg class="ic"><use href="#i-cam"/></svg></span></div>
  <div class="row"><i class="av">C</i><span class="nm">Caio</span><span class="sh w"><svg class="ic"><use href="#i-mon"/></svg></span></div>
  <div class="row"><i class="av">D</i><span class="nm">Duda</span><span class="sh"><svg class="ic"><use href="#i-cam"/></svg></span></div>
  <div class="row"><i class="av">M</i><span class="nm">Marta <span style="color:var(--g6);font-weight:400">· you</span></span></div>
  <div class="sc"><span>Webcams</span><span>Everything</span><span>Nothing</span></div>
  <div class="lbl" style="margin-top:16px"><span>Not here</span><em>2</em></div>
  <div class="row away"><i class="av">E</i><span class="nm">Edu</span></div>
  <div class="row away"><i class="av">F</i><span class="nm">Fê</span></div>
 </div>
 <div class="foot">
  <div class="mine"><div class="m cm b"><i class="lp"></i><i class="bd"></i><i class="hd"></i><i class="hr"></i></div></div>
  <div class="meta"><span><b>Bia</b> and <b>Caio</b> watching</span><span class="stop">Stop</span></div>
  <div class="btns"><span class="btn"><svg class="ic"><use href="#i-mon"/></svg>Share screen<kbd>S</kbd></span><span class="btn s"><svg class="ic"><use href="#i-cam"/></svg>Webcam live</span></div>
 </div>
</aside>
<main class="stage">
 <div class="cell"><div class="tile"><div class="m vx"><i class="sun"></i><i class="cl"></i><i class="t" style="left:0%;height:34%"></i><i class="t" style="left:12.5%;height:38%"></i><i class="t" style="left:25%;height:30%"></i><i class="t" style="left:37.5%;height:26%"></i><i class="t" style="left:50%;height:30%"></i><i class="t" style="left:62.5%;height:42%"></i><i class="t" style="left:75%;height:46%"></i><i class="t" style="left:87.5%;height:36%"></i><i class="tr" style="left:66%;bottom:42%;height:70px"></i><i class="lf" style="left:calc(66% - 32px);bottom:calc(42% + 60px)"></i><div class="hb"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div><div class="cap">Bia<small>screen</small></div></div>
 <div class="cell"><div class="tile"><div class="m rc"><i class="mt"></i><i class="rd"></i><i class="ln"></i><i class="car"></i><b class="ps">2/12</b><b class="sp">187<small>km/h</small></b></div></div><div class="cap">Caio<small>screen</small></div></div>
 <div class="cell"><div class="tile"><div class="m cm"><i class="sh"></i><i class="lp"></i><i class="bd"></i><i class="hd"></i><i class="hr"></i><i class="hp"></i></div></div><div class="cap">Bia<small>webcam</small></div></div>
</main>
</body></html>
